<!DOCTYPE html>
<html lang="th">
<head>

    <title>Admin Login</title>
</head>
<body class="bg-dark d-flex align-items-center justify-content-center" style="height: 100vh;">

            <input type="password" name="password" class="form-control mb-3" placeholder="กรอกรหัสผ่านลับ" autofocus>
            <button class="btn btn-primary w-100">ยืนยันการเข้าสู่ระบบ</button>
            <a href="/" class="btn btn-link w-100 mt-2 text-muted">กลับหน้าหลัก</a>
        </form>
    </div>
</body>
</html>
