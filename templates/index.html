<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ElectroHub Labs - ระบบจัดการคลังพัสดุ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Sarabun&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f8fafc; --text: #334155; --card-bg: #ffffff; }
        [data-theme="dark"] { --bg: #1e293b; --text: #f1f5f9; --card-bg: #334155; }

        body { font-family: 'Sarabun', sans-serif; background-color: var(--bg); color: var(--text); transition: background 0.3s; }
        h1, .navbar-brand { font-family: 'Chakra Petch', sans-serif; }

        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .product-card { background-color: var(--card-bg) !important; border-radius: 15px; transition: transform 0.3s, box-shadow 0.3s; border: 1px solid #e2e8f0; }
        .product-card:hover { transform: scale(1.03); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .admin-actions { position: absolute; top: 10px; right: 10px; }
    </style>
</head>
<body>

    <div id="loader"><div class="spinner-border text-info"></div></div>

    <nav class="navbar navbar-light bg-white shadow-sm p-3 sticky-top">
        <div class="container">
            <a class="navbar-brand fs-3" href="/">⚡ ElectroHub <span class="text-info">Labs</span></a>
            <div class="d-flex gap-2">
                <button class="btn btn-sm btn-outline-secondary rounded-pill" onclick="toggleTheme()">🌓</button>
                <button class="btn btn-dark rounded-pill" data-bs-toggle="offcanvas" data-bs-target="#cartSidebar">🛒 ตะกร้า</button>
                {% if is_admin %}
                    <a href="/logout" class="btn btn-outline-danger rounded-pill">ออกจากระบบ</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container my-5">
        {% if is_admin %}
        <div class="row g-4 mb-5">
            <div class="col-md-8">
                <div class="row g-3">
                    <div class="col-6"><div class="card p-3 shadow-sm">เบอร์อะไหล่: <strong>{{ total_items }}</strong></div></div>
                    <div class="col-6"><div class="card p-3 shadow-sm">สต็อกรวม: <strong>{{ total_stock }}</strong></div></div>
                </div>
            </div>
        </div>
        {% endif %}

        <input type="text" name="search" class="form-control rounded-pill w-50 mx-auto mb-5" placeholder="🔍 ค้นหาอะไหล่แบบ Real-time...">

        <div class="row g-4">
            {% for p in products %}
            <div class="col-md-4">
                <div class="product-card p-3 h-100 shadow-sm position-relative">
                    {% if is_admin %}
                    <div class="admin-actions">
                        <a href="/edit/{{ p.id }}" class="btn btn-warning btn-sm">✏️</a>
                        <a href="/delete/{{ p.id }}" class="btn btn-danger btn-sm">🗑️</a>
                    </div>
                    {% endif %}
                    <img src="{{ p.image_url }}" style="height:150px; object-fit:contain;" class="mb-3 w-100">
                    <h5 class="fw-bold">{{ p.name }}</h5>
                    <p class="text-success fw-bold">{{ p.price }}</p>
                    <small>คงเหลือ: {{ p.stock }} ชิ้น</small>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Loader
        window.addEventListener('load', () => document.getElementById('loader').style.display = 'none');

        // Real-time Search
        document.querySelector('input[name="search"]').addEventListener('input', function(e) {
            let val = e.target.value.toLowerCase();
            document.querySelectorAll('.product-card').forEach(card => {
                card.parentElement.style.display = card.innerText.toLowerCase().includes(val) ? '' : 'none';
            });
        });

        // Dark Mode
        function toggleTheme() {
            document.documentElement.setAttribute('data-theme',
                document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        }
    </script>
</body>
</html>
