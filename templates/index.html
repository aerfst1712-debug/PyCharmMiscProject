<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroHub Labs - คลังอุปกรณ์อิเล็กทรอนิกส์</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; color: #1e293b; }
        h1, h2, h3, .navbar-brand { font-family: 'Chakra Petch', sans-serif; }
        .navbar { background-color: #0f172a !important; border-bottom: 3px solid #0284c7; }
        .card { background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; transition: transform 0.2s, box-shadow 0.2s; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .card-title { color: #0f172a; font-weight: 700; }
        .badge-tech { background-color: #e0f2fe; color: #0369a1; font-weight: 500; }
        .price-tag { color: #059669; font-weight: bold; font-size: 1.1rem; }
        .btn-view { background-color: #0284c7; color: white; border-radius: 20px; }
        .btn-view:hover { background-color: #0369a1; color: white; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark p-3 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="/">⚡ ElectroHub <span class="text-info">Labs</span></a>
            <a href="/add" class="btn btn-success btn-sm rounded-pill px-3 fw-bold">➕ เพิ่มเบอร์ IC</a>
        </div>
    </nav>

    <div class="container my-5">
        <div class="text-center mb-5">
            <h1 class="fw-bold text-dark display-5">คลังข้อมูลส่วนประกอบอิเล็กทรอนิกส์</h1>
            <p class="text-muted fs-5">สืบค้นสเปค รายละเอียดชิ้นส่วน และข้อมูลทางเทคนิคได้อย่างรวดเร็ว</p>
        </div>

        <div class="row g-4">
            {% for product in products %}
            <div class="col-md-4 col-sm-6">
                <div class="card h-100 shadow-sm p-2">
                    <img src="{{ product.image_url }}" class="card-img-top rounded p-2" alt="{{ product.name }}" style="height: 200px; object-fit: contain; background: #f1f5f9;">
                    <div class="card-body d-flex flex-column bg-transparent">
                        <span class="badge badge-tech align-self-start mb-2">{{ product.category }}</span>
                        <h4 class="card-title mb-2">{{ product.name }}</h4>
                        <p class="card-text text-muted text-truncate mb-3">{{ product.description }}</p>
                        <div class="d-flex justify-content-between align-items-center mt-auto bg-transparent">
                            <span class="price-tag">ประมาณ {{ product.price }}</span>
                            <a href="/product/{{ product.id }}" class="btn btn-view btn-sm px-4">ดูรายละเอียด</a>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

</body>
</html>
