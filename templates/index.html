<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ElectroHub Labs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .product-card { position: relative; border-radius: 15px; background: white; border: 1px solid #e2e8f0; padding: 15px; }
        .admin-actions { position: absolute; top: 10px; right: 10px; z-index: 10; }
    </style>
</head>
<body>

    <nav class="navbar shadow-sm p-3 mb-4 bg-white">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">⚡ ElectroHub Labs</a>
            <div>
                {% if is_admin %}
                    <span class="badge bg-danger">Admin Mode</span>
                    <a href="/logout" class="btn btn-outline-danger btn-sm">ออกจากระบบ</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% if is_admin %}
        <div class="alert alert-info">คุณกำลังใช้งานในโหมดแอดมิน</div>
        {% endif %}

        <div class="row g-4">
            {% for p in products %}
            <div class="col-md-4">
                <div class="product-card shadow-sm h-100">

                    {% if is_admin %}
                    <div class="admin-actions">
                        <a href="/edit/{{ p.id }}" class="btn btn-warning btn-sm">✏️ แก้ไข</a>
                        <a href="/delete/{{ p.id }}" class="btn btn-danger btn-sm" onclick="return confirm('ยืนยันการลบ?')">🗑️ ลบ</a>
                    </div>
                    {% endif %}

                    <img src="{{ p.image_url }}" style="height:150px; width:100%; object-fit:contain;" class="mb-3">
                    <h5 class="fw-bold">{{ p.name }}</h5>
                    <p class="text-success">{{ p.price }}</p>
                    <small class="text-muted">คงเหลือ: {{ p.stock }} ชิ้น</small>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
