<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แก้ไขข้อมูล: {{ product.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; color: #334155; }
        h1 { font-family: 'Chakra Petch', sans-serif; }
        .form-box { background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; max-width: 700px; margin: 0 auto; }
    </style>
</head>
<body>

    <div class="container my-5">
        <div class="mb-4">
            <a href="/" class="btn btn-outline-secondary btn-sm rounded-pill text-decoration-none">⬅ กลับหน้าหลัก</a>
        </div>

        <div class="form-box p-4 p-md-5 shadow-sm">
            <h1 class="fw-bold text-dark text-center mb-4">✏️ แก้ไขข้อมูลอุปกรณ์</h1>
            <h5 class="text-center text-muted mb-4">{{ product.name }}</h5>
            <hr class="mb-4">

            <form method="POST" action="/edit/{{ product.id }}">
                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary">ชื่อชิ้นส่วน / เบอร์อะไหล่ (Name)</label>
                    <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-secondary">หมวดหมู่อุปกรณ์ (Category)</label>
                        <input type="text" name="category" class="form-control" value="{{ product.category }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-secondary">ราคาขายสินค้า (เฉพาะตัวเลขหน่วยบาท)</label>
                        <input type="number" name="price" class="form-control" value="{{ product.price }}" min="0" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold text-primary">🔢 ปริมาณสต็อกสินค้าปัจจุบัน (Stock Number)</label>
                    <input type="number" name="stock" class="form-control border-primary" min="0" value="{{ product.stock or 0 }}" step="1" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary">ลิงก์ไฟล์คู่มือฉบับจริง (Datasheet URL)</label>
                    <input type="url" name="datasheet_url" class="form-control" value="{{ product.datasheet_url or '' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary">ลิงก์รูปภาพของอุปกรณ์ (Image URL)</label>
                    <input type="url" name="image_url" class="form-control" value="{{ product.image_url }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary">คำอธิบายหน้าที่การทำงานหลัก (Description)</label>
                    <textarea name="description" class="form-control" rows="3" required>{{ product.description }}</textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold text-secondary">คุณสมบัติทางเทคนิค (Specs) <small class="text-primary">*พิมพ์ 1 คุณสมบัติ ต่อ 1 บรรทัด</small></label>
                    <textarea name="specs" class="form-control" rows="3" required>{{ product.specs }}</textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2.5 rounded-pill fw-bold fs-5" style="background-color: #0ea5e9; border: none;">💾 อัปเดตการแก้ไขข้อมูลคลังพัสดุ</button>
            </form>
        </div>
    </div>

</body>
</html>
