<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เพิ่มอุปกรณ์ใหม่ - ElectroHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; color: #334155; }
        h1, .navbar-brand { font-family: 'Chakra Petch', sans-serif; }
        .form-box { background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .form-control { background-color: #fff; border: 1px solid #cbd5e1; color: #1e293b; }
        .form-control:focus { border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2,132,199,0.1); }
    </style>
</head>
<body>

    <div class="container my-5">
        <div class="col-lg-8 mx-auto">
            <a href="/?admin=true" class="btn btn-outline-secondary btn-sm rounded-pill mb-4">⬅ กลับหน้าหลัก</a>

            <div class="form-box p-4 p-md-5">
                <h1 class="fw-bold mb-4 text-dark text-center">➕ เพิ่มข้อมูลอุปกรณ์ / เบอร์ IC ใหม่</h1>

                <form action="/add?admin=true" method="POST">
                    <div class="row bg-transparent">
                        <div class="col-md-6 mb-3 bg-transparent">
                            <label class="form-label fw-bold">ชื่ออุปกรณ์ / เบอร์ IC</label>
                            <input type="text" class="form-control" name="name" placeholder="เช่น IC LM358" required>
                        </div>
                        <div class="col-md-6 mb-3 bg-transparent">
                            <label class="form-label fw-bold">หมวดหมู่</label>
                            <input type="text" class="form-control" name="category" placeholder="เช่น Integrated Circuit" required>
                        </div>
                    </div>

                    <div class="row bg-transparent">
                        <div class="col-md-6 mb-3 bg-transparent">
                            <label class="form-label fw-bold">ราคา (บาท)</label>
                            <input type="text" class="form-control" name="price" placeholder="เช่น 20 บาท" required>
                        </div>
                        <div class="col-md-6 mb-3 bg-transparent">
                            <label class="form-label fw-bold">ลิงก์รูปภาพตัวอย่าง (URL)</label>
                            <input type="url" class="form-control" name="image_url" placeholder="https://..." required>
                        </div>
                    </div>

                    <div class="mb-3 bg-transparent">
                        <label class="form-label fw-bold">คำอธิบายรายละเอียด</label>
                        <textarea class="form-control" name="description" rows="3" placeholder="อธิบายหน้าที่การทำงานเบื้องต้น..." required></textarea>
                    </div>

                    <div class="mb-4 bg-transparent">
                        <label class="form-label fw-bold">คุณสมบัติทางเทคนิค (แยกด้วยเครื่องหมายจุลภาค , )</label>
                        <textarea class="form-control" name="specs" rows="2" placeholder="เช่น ขาใช้งาน: 8 พิน, แรงดันไฟเลี้ยง: 5V" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold py-2.5" style="background-color: #0284c7;">💾 บันทึกข้อมูลเข้าฐานข้อมูลออนไลน์</button>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
