<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เพิ่มส่วนประกอบอิเล็กทรอนิกส์ใหม่</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; color: #334155; }
        h1 { font-family: 'Chakra Petch', sans-serif; }
        .form-box { background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; max-width: 700px; margin: 0 auto; }
    </style>
</head>
<body>

    <div class="container my-5">
        <div class="mb-4">
            <a href="/" class="btn btn-outline-secondary btn-sm rounded-pill">⬅ กลับหน้าหลัก</a>
        </div>

        <div class="form-box p-4 p-md-5 shadow-sm">
            <h1 class="fw-bold text-dark text-center mb-4">➕ เพิ่มอุปกรณ์ชิ้นส่วนใหม่</h1>
            <hr class="mb-4">

            <form method="POST" action="/add">
                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary">ชื่อชิ้นส่วน / เบอร์อะไหล่ (Name)</label>
                    <input type="text" name="name" class="form-control" placeholder="เช่น IC NE555, Resistor 10K" required>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-secondary">หมวดหมู่อุปกรณ์ (Category)</label>
                        <input type="text" name="category" class="form-control" placeholder="เช่น Integrated Circuit, Sensor" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-secondary">ราคาขายสินค้า (Price)</label>
                        <input type="text" name="price" class="form-control" placeholder="เช่น 15 บาท, 350 บาท" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold text-primary">🔢 ปริมาณสต็อกสินค้าเริ่มต้น (Stock Number)</label>
                    <input type="number" name="stock" class="form-control border-primary" min="0" value="0" step="1" title="กรุณากรอกตัวเลขจำนวนเต็มบวกตั้งแต่ 0 ขึ้นไปเท่านั้น" required>
                    <div class="form-text text-muted">ระบบจะล็อกห้ามป้อนตัวอักษรหรือค่าติดลบเพื่อความปลอดภัยของระบบฐานข้อมูลคลังพัสดุ</div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary">ลิงก์ไฟล์คู่มือฉบับจริง (Datasheet URL)</label>
                    <input type="url" name="datasheet_url" class="form-control" placeholder="https://www.example.com/datasheet.pdf">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary">ลิงก์รูปภาพของอุปกรณ์ (Image URL)</label>
                    <input type="url" name="image_url" class="form-control" placeholder="https://example.com/image.jpg" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary">คำอธิบายภาพรวม/หน้าที่การทำงานหลัก (Description)</label>
                    <textarea name="description" class="form-control" rows="3" placeholder="ระบุขยายขอบเขตความสามารถสั้นๆ..." required></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold text-secondary">คุณสมบัติทางเทคนิค (Specs) <small class="text-danger">*ใช้เครื่องหมายจุลภาค ( , ) คั่นแต่ละสเปก</small></label>
                    <input type="text" name="specs" class="form-control" placeholder="ขาใช้งาน: 8 พิน, ไฟเลี้ยง: 5V, ชิปประมวลผล: ATmega" required>
                </div>

                <button type="submit" class="btn btn-success w-100 py-2.5 rounded-pill fw-bold fs-5">💾 บันทึกและอัปเดตระบบคลังพัสดุ</button>
            </form>
        </div>
    </div>

</body>
</html>
